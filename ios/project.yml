# XcodeGen spec: `xcodegen` regenerates Milkrun.xcodeproj (not committed).
# The shared Kotlin code arrives as MilkrunKit.xcframework, built by Gradle first (see build-kit.sh).
name: Milkrun
options:
  bundleIdPrefix: com.milkrun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Milkrun:
    type: application
    platform: iOS
    sources:
      - path: Milkrun
    dependencies:
      - framework: ../shared/kit/build/XCFrameworks/debug/MilkrunKit.xcframework
        embed: false
      - sdk: libsqlite3.tbd
    info:
      path: Milkrun/Info.plist
      properties:
        CFBundleDisplayName: Milkrun
        CFBundleShortVersionString: "0.4.0"
        UILaunchScreen:
          UIColorName: Kraft
        UIAppFonts: [BigShouldersStencilDisplay.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.milkrun.sync]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        MilkrunServerURL: $(MILKRUN_SERVER_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milkrun.driver
        MILKRUN_SERVER_URL: "http://localhost:18081"
        OTHER_LDFLAGS: [-lsqlite3]
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Ink
  MilkrunTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MilkrunTests]
    dependencies:
      - target: Milkrun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MilkrunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MilkrunUITests]
    dependencies:
      - target: Milkrun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Milkrun
schemes:
  Milkrun:
    build:
      targets:
        Milkrun: all
        MilkrunTests: [test]
    test:
      targets: [MilkrunTests]
  MilkrunShift:
    build:
      targets:
        Milkrun: all
        MilkrunUITests: [test]
    test:
      targets: [MilkrunUITests]
