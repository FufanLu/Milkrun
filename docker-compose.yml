# Local stack: PostgreSQL + the sync service.
#   ./gradlew :server:app:buildFatJar && docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: milkrun
      POSTGRES_PASSWORD: milkrun
      POSTGRES_DB: milkrun
    command: ["postgres", "-c", "synchronous_commit=on"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milkrun"]
      interval: 2s
      retries: 20

  server:
    build: server/app
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/milkrun
      DATABASE_USER: milkrun
      DATABASE_PASSWORD: milkrun
      JWT_SECRET: local-development-secret-change-me-please
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
