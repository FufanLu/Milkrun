name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: shared · server · simulation · android · lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew spotlessCheck
      - name: Test (server tests use Testcontainers Postgres)
        run: ./gradlew jvmTest testAndroidHostTest test
      - name: Android app (debug build + Roborazzi screenshot goldens)
        run: ./gradlew :android:app:assembleDebug :android:app:verifyRoborazziDebug
      - name: Server image
        run: |
          ./gradlew :server:app:buildFatJar
          docker build -t milkrun-server server/app
          docker run -d --name pg -e POSTGRES_USER=milkrun -e POSTGRES_PASSWORD=milkrun -e POSTGRES_DB=milkrun -p 5432:5432 postgres:17-alpine
          until docker exec pg pg_isready -U milkrun; do sleep 1; done
          docker run -d --name server --network host -e DATABASE_URL=jdbc:postgresql://localhost:5432/milkrun \
            -e DATABASE_PASSWORD=milkrun -e JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret -e PORT=8080 milkrun-server
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          curl -sf localhost:8080/readyz
          docker logs server | tail -5

  ios:
    name: iOS (shared modules · app · Swift tests)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Shared modules on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test
      - name: iOS app (MilkrunKit + SwiftUI, Swift 6 strict concurrency) and Swift tests
        run: |
          brew install xcodegen
          ios/build-kit.sh
          SIM=$(xcrun simctl list devices available | grep -m1 -E "iPhone [0-9]+ " | grep -oE "[0-9A-F-]{36}")
          xcodebuild -project ios/Milkrun.xcodeproj -scheme Milkrun -destination "id=$SIM" -derivedDataPath ios/build/dd test
